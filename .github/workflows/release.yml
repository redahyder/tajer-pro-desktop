# بناء تطبيق ويندوز (ملف التثبيت + النسخة المحمولة) ونشره في Releases
# يعمل تلقائياً عند أي تغيير على الفرع main، أو يدوياً من تبويب Actions.
# رقم الإصدار يؤخذ من package.json وينشأ وسم vX.Y.Z تلقائياً.
# رابط التحميل الثابت لآخر نسخة:
#   https://github.com/redahyder/tajer-pro-desktop/releases/latest/download/TajerPro-Setup.exe
name: Build Windows app

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build installer
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # الملفات تُنشر في Releases مباشرة (لا تُحسب من مساحة Artifacts في حساب GitHub)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: تاجر برو لسطح المكتب ${{ steps.version.outputs.version }}
          make_latest: "true"
          files: dist/*.exe
          body: |
            ## تاجر برو — تطبيق ويندوز
            - **TajerPro-Setup.exe**: ملف التثبيت (يضيف اختصاراً على سطح المكتب وقائمة ابدأ) — موصى به.
            - **TajerPro-Portable.exe**: نسخة تعمل مباشرة بدون تثبيت.

            بعد التثبيت سجّل دخولك باسم المستخدم وكلمة المرور الخاصة بحسابك في منصة تاجر برو.
            ملاحظة: قد يظهر تحذير Windows SmartScreen لأن البرنامج غير موقّع رقمياً — اضغط "معلومات إضافية" ثم "تشغيل على أي حال".
